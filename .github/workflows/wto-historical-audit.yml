name: WTO historical audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/wto-historical-audit.mjs'
      - 'scripts/build-wto-historical-report.mjs'
      - 'scripts/wto-confidence-calibration.mjs'
      - 'scripts/wto-prospective-snapshot.mjs'
      - 'tests/wto-historical-audit.test.mjs'
      - 'tests/wto-historical-report.test.mjs'
      - 'tests/wto-confidence-calibration.test.mjs'
      - 'tests/wto-prospective-snapshot.test.mjs'
      - 'tests/wto-audit-dashboard.test.mjs'
      - 'wto-audit.html'
      - 'wto-audit-summary-2026.json'
      - 'wto-audit-disagreements-2026.json'
      - '.github/workflows/wto-historical-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run audit unit tests
        run: node --test tests/wto-historical-audit.test.mjs tests/wto-historical-report.test.mjs tests/wto-audit-dashboard.test.mjs tests/wto-confidence-calibration.test.mjs tests/wto-prospective-snapshot.test.mjs
      - name: Rebuild report from original predictions and completed ESPN finals
        run: node scripts/build-wto-historical-report.mjs
      - name: Build read-only Phase 2 confidence calibration
        run: node scripts/wto-confidence-calibration.mjs
      - name: Upload report without modifying source data
        uses: actions/upload-artifact@v4
        with:
          name: wto-historical-audit-2026
          path: |
            reports/wto-historical-audit-2026.json
            reports/wto-historical-audit-2026.md
            reports/wto-confidence-calibration-2026.json
            reports/wto-confidence-calibration-2026.md
