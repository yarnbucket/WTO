name: WTO Phase 2B prospective capture
on:
  workflow_dispatch:
  push:
    paths:
      - 'incoming/wto-ex-week*.json'
      - 'wto-ex-week*.json'
      - 'scripts/wto-publish-and-lock.mjs'
      - 'scripts/wto-prospective-grade-policy.mjs'
      - 'tests/wto-publish-and-lock.test.mjs'
      - 'scripts/wto-unify-capture-status.mjs'
      - 'scripts/wto-stage-permanent-archive.mjs'
      - 'tests/wto-stage-permanent-archive.test.mjs'
      - '.github/workflows/wto-prospective-capture.yml'
  schedule:
    # Thursday and Sunday before most NFL kickoffs (UTC; daylight saving varies).
    - cron: '30 16 * * 4'
    - cron: '30 16 * * 0'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: wto-phase2c-prospective-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test pregame capture integrity
        run: node --test tests/wto-prospective-snapshot.test.mjs tests/wto-auto-capture.test.mjs tests/wto-prospective-grade-policy.test.mjs tests/wto-publish-and-lock.test.mjs tests/wto-unify-capture-status.test.mjs tests/wto-stage-permanent-archive.test.mjs
      - name: Publish and lock incoming future prediction archives
        run: node scripts/wto-publish-and-lock.mjs
      - name: Inspect upcoming archive and confidence-grade readiness
        run: node scripts/wto-capture-readiness.mjs
      - name: Capture only authentic graded pregame archive entries
        run: node scripts/wto-auto-capture.mjs
      - name: Reconcile publisher and legacy diagnostics
        run: node scripts/wto-unify-capture-status.mjs
      - name: Stage permanent audit records
        run: node scripts/wto-stage-permanent-archive.mjs
      - name: Propose permanent archive through reviewable pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add archive/prospective/
          if git diff --cached --quiet -- archive/prospective/; then
            echo "No new immutable records to archive; existing snapshots preserved"
            exit 0
          fi
          # Stable identity per set of archive paths prevents duplicate branches on retries.
          ARCHIVE_SET="$(git diff --cached --name-only -- archive/prospective/ | sha256sum | cut -c1-16)"
          BRANCH="wto/phase2c-archive-$ARCHIVE_SET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::notice::Reusing existing immutable archive branch $BRANCH"
          else
            git switch -c "$BRANCH"
            git commit -m "Archive verified prospective snapshots ($ARCHIVE_SET)"
            git push origin "$BRANCH"
          fi
          OPEN_PR="$(gh pr list --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$OPEN_PR" ]; then
            echo "::notice::Archive PR #$OPEN_PR already exists; no duplicate created"
            exit 0
          fi
          if ! gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" --title "WTO Phase 2C: archive verified prospective snapshots" --body "Immutable pregame snapshot archive proposed for review. No live predictor or MY PICKS changes."; then
            echo "::error::Archive branch $BRANCH was preserved, but PR creation failed. In repository Settings > Actions > General, enable 'Allow GitHub Actions to create and approve pull requests' or manually open a PR for this branch."
            exit 1
          fi
      - name: Upload immutable run artifact and capture status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wto-prospective-capture-${{ github.run_id }}
          path: reports/prospective/
          retention-days: 90
