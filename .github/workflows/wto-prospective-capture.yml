name: WTO Phase 2B prospective capture
on:
  workflow_dispatch:
  push:
    paths:
      - 'incoming/wto-ex-week*.json'
      - 'wto-ex-week*.json'
      - 'scripts/wto-publish-and-lock.mjs'
      - 'scripts/wto-prospective-grade-policy.mjs'
      - 'tests/wto-publish-and-lock.test.mjs'
      - 'scripts/wto-unify-capture-status.mjs'
      - 'scripts/wto-stage-permanent-archive.mjs'
  schedule:
    # Thursday and Sunday before most NFL kickoffs (UTC; daylight saving varies).
    - cron: '30 16 * * 4'
    - cron: '30 16 * * 0'
permissions:
  contents: write
  pull-requests: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test pregame capture integrity
        run: node --test tests/wto-prospective-snapshot.test.mjs tests/wto-auto-capture.test.mjs tests/wto-prospective-grade-policy.test.mjs tests/wto-publish-and-lock.test.mjs tests/wto-unify-capture-status.test.mjs
      - name: Publish and lock incoming future prediction archives
        run: node scripts/wto-publish-and-lock.mjs
      - name: Inspect upcoming archive and confidence-grade readiness
        run: node scripts/wto-capture-readiness.mjs
      - name: Capture only authentic graded pregame archive entries
        run: node scripts/wto-auto-capture.mjs
      - name: Reconcile publisher and legacy diagnostics
        run: node scripts/wto-unify-capture-status.mjs
      - name: Stage permanent audit records
        run: node scripts/wto-stage-permanent-archive.mjs
      - name: Propose permanent archive through reviewable pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- archive/prospective/)" ]; then
            echo "No new immutable records to archive"
            exit 0
          fi
          BRANCH="wto/phase2c-archive-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add archive/prospective/
          git commit -m "Archive verified prospective snapshots (run ${{ github.run_id }})"
          git push origin "$BRANCH"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" --title "WTO Phase 2C: archive verified prospective snapshots" --body "Immutable pregame snapshot archive proposed for review. No live predictor or MY PICKS changes."
      - name: Upload immutable run artifact and capture status
        uses: actions/upload-artifact@v4
        with:
          name: wto-prospective-capture-${{ github.run_id }}
          path: reports/prospective/
          retention-days: 90
