name: WTO Phase 2B prospective capture
on:
  workflow_dispatch:
  push:
    paths:
      - 'incoming/wto-ex-week*.json'
      - 'wto-ex-week*.json'
      - 'scripts/wto-publish-and-lock.mjs'
      - 'scripts/wto-prospective-grade-policy.mjs'
      - 'tests/wto-publish-and-lock.test.mjs'
      - 'scripts/wto-unify-capture-status.mjs'
  schedule:
    # Thursday and Sunday before most NFL kickoffs (UTC; daylight saving varies).
    - cron: '30 16 * * 4'
    - cron: '30 16 * * 0'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test pregame capture integrity
        run: node --test tests/wto-prospective-snapshot.test.mjs tests/wto-auto-capture.test.mjs tests/wto-prospective-grade-policy.test.mjs tests/wto-publish-and-lock.test.mjs tests/wto-unify-capture-status.test.mjs
      - name: Publish and lock incoming future prediction archives
        run: node scripts/wto-publish-and-lock.mjs
      - name: Inspect upcoming archive and confidence-grade readiness
        run: node scripts/wto-capture-readiness.mjs
      - name: Capture only authentic graded pregame archive entries
        run: node scripts/wto-auto-capture.mjs
      - name: Reconcile publisher and legacy diagnostics
        run: node scripts/wto-unify-capture-status.mjs
      - name: Upload immutable run artifact and capture status
        uses: actions/upload-artifact@v4
        with:
          name: wto-prospective-capture-${{ github.run_id }}
          path: reports/prospective/
          retention-days: 90
