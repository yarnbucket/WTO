<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF26 NFL Season Lines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#0C1F14;
    --field-line:#1F3D2A;
    --turf:#132C1C;
    --chalk:#EFEFE7;
    --grey:#8FA396;
    --gold:#FFC72C;
    --win:#3FD68A;
    --loss:#E6534A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;color:var(--chalk);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 78px, rgba(255,255,255,0.035) 78px, rgba(255,255,255,0.035) 80px),
      radial-gradient(ellipse at top, #10301C 0%, #081A10 55%, #05100A 100%);
    background-attachment:fixed;
  }
  .screen{max-width:480px;margin:0 auto;padding:0 0 60px;}

  .marquee{
    background:#060B07;
    border-bottom:2px solid var(--gold);
    padding:10px 14px 8px;
    position:relative;
  }
  .marquee::after{
    content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 10px, transparent 10px 20px);
  }
  .masthead{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .badge{
    width:36px;height:36px;flex-shrink:0;
    background:var(--gold);color:#0C1F14;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Anton',sans-serif;line-height:1;
    border:2px solid #060B07;box-shadow:0 0 0 2px var(--gold);
  }
  .badge .fmain{font-size:12px;letter-spacing:0.3px;}
  .badge .fsub{font-size:6px;letter-spacing:0.5px;margin-top:0px;}
  .masthead .title{
    font-family:'Anton',sans-serif;font-size:15px;letter-spacing:0.5px;line-height:1.15;
    text-transform:uppercase;color:var(--chalk);
  }
  .masthead .sub{flex:1;}
  .updated{
    margin-left:auto;flex-shrink:0;
    display:flex;align-items:center;gap:6px;
    border:1px solid #24352A;background:#0B140D;padding:4px 9px;
    font-family:'Share Tech Mono',monospace;font-size:9.5px;color:var(--win);white-space:nowrap;
  }
  .updated .dot{
    width:6px;height:6px;border-radius:50%;background:var(--win);flex-shrink:0;
    box-shadow:0 0 6px var(--win);
    animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.25;}}

  .week-strip{display:flex;gap:7px;overflow-x:auto;}
  .week-strip::-webkit-scrollbar{display:none;}
  .week-chip{
    flex-shrink:0;width:40px;height:30px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Share Tech Mono',monospace;font-size:12.5px;letter-spacing:0.5px;
    border:1px solid #24352A;color:#5C7566;background:#0B140D;
  }
  .week-chip.active{
    background:#0C1F14;color:var(--gold);border-color:var(--gold);
    text-shadow:0 0 8px rgba(255,199,44,0.7);
    box-shadow:inset 0 0 0 1px rgba(255,199,44,0.3);
  }

  .hero{padding:10px 14px 12px;}
  .hero .eyebrow{
    font-family:'Anton',sans-serif;font-size:10px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin-bottom:1px;
  }
  .hero h1{font-family:'Anton',sans-serif;font-size:26px;margin:0 0 4px;letter-spacing:0.4px;line-height:1;}
  .hero .tagline{font-size:11px;color:var(--grey);margin-bottom:10px;}

  .select-wrap{position:relative;}
  .select-wrap select{
    width:100%;appearance:none;-webkit-appearance:none;
    background:var(--turf);border:2px solid var(--chalk);color:var(--chalk);
    font-size:13px;font-weight:600;padding:9px 36px 9px 12px;
  }
  .select-wrap::after{
    content:"";position:absolute;right:16px;top:50%;
    width:9px;height:9px;border-right:2px solid var(--chalk);border-bottom:2px solid var(--chalk);
    transform:translateY(-65%) rotate(45deg);pointer-events:none;
  }

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px 0;}
  .stat-tile{
    background:var(--turf);border:1px solid var(--field-line);
    border-top:2px solid var(--gold);
    padding:8px 10px 7px;
  }
  .stat-tile .num{font-family:'Anton',sans-serif;font-size:21px;line-height:1;letter-spacing:0.4px;}
  .stat-tile .lbl{font-size:9px;color:var(--grey);letter-spacing:0.6px;text-transform:uppercase;margin-top:2px;}

  .yard-marker{
    display:flex;align-items:center;gap:10px;
    margin:16px 14px 8px;
    font-family:'Anton',sans-serif;font-size:15px;letter-spacing:1.5px;color:var(--chalk);text-transform:uppercase;
  }
  .yard-marker::after{
    content:"";flex:1;height:0;border-top:2px dashed var(--field-line);
  }

  .game-card{
    background:var(--turf);border:1px solid var(--field-line);
    margin:0 14px 14px;
  }
  .game-top{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;border-bottom:1px solid var(--field-line);
    font-size:13px;color:var(--grey);
  }
  .game-top .final{color:var(--win);font-weight:700;letter-spacing:0.5px;font-family:'Anton',sans-serif;font-size:13px;}

  .scoreboard{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 14px;gap:8px;}
  .team-block{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;}
  .team-block .crest{
    width:52px;height:52px;flex-shrink:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Anton',sans-serif;font-size:16px;color:#0C1F14;
    border:2px solid var(--chalk);
  }
  .team-block .crest img{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 5px 5px rgba(0,0,0,.55));}
  .team-block .tname{font-family:'Inter',sans-serif;font-weight:700;font-size:13.5px;text-align:center;line-height:1.2;}
  .team-block .tscore{font-size:11px;color:var(--grey);}
  .score-mid{
    font-family:'Share Tech Mono',monospace;font-size:34px;line-height:1.05;color:var(--gold);
    text-align:center;flex-shrink:0;
    text-shadow:0 0 16px rgba(255,199,44,0.35);
  }

  .lines-row{display:flex;border-top:1px solid var(--field-line);}
  .lines-row .col{flex:1;text-align:center;padding:12px 8px;}
  .lines-row .col+.col{border-left:1px solid var(--field-line);}
  .lines-row .lbl{font-size:10px;color:var(--grey);letter-spacing:1px;text-transform:uppercase;}
  .lines-row .val{font-family:'Anton',sans-serif;font-size:16px;letter-spacing:0.3px;margin-top:3px;}

  .result-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 16px;background:#0E2416;font-size:12.5px;
  }
  .result-row .win{color:var(--win);font-weight:700;}
  .result-row .push{color:var(--grey);font-weight:700;}
  .result-row b{color:var(--chalk);}
  .game-top .scheduled{color:var(--gold);font-weight:700;letter-spacing:.5px;font-family:'Anton',sans-serif;font-size:13px;}
  .games-grid{display:grid;grid-template-columns:1fr;}
  .empty{margin:0 14px;padding:34px 20px;text-align:center;border:1px dashed var(--field-line);background:var(--turf);color:var(--grey);font-size:13px;}
  .error{display:none;margin:12px 14px;padding:12px;border:1px solid var(--loss);background:#321614;color:#ffd9d5;font-size:12px;}
  .footer{margin:28px 14px 0;padding-top:14px;border-top:1px solid var(--field-line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--grey);font-size:10px;}
  .game-action{position:relative;width:100%;border:0;border-top:1px solid var(--field-line);background:#09170E;color:var(--gold);padding:12px 16px;text-align:right;font-family:'Anton',sans-serif;font-size:14px;letter-spacing:.8px;cursor:pointer;}
  .game-action:focus-visible,.back-btn:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}.game-action:hover{background:#10291A}
  .detail-view{display:none;min-height:100vh;padding-bottom:50px}.detail-view.active{display:block}.list-view.hidden{display:none}
  .detail-head{position:sticky;top:0;z-index:10;background:#060B07;border-bottom:2px solid var(--gold);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  .back-btn{border:0;background:transparent;color:var(--gold);padding:8px 0;font-family:'Anton',sans-serif;font-size:15px;letter-spacing:1px;cursor:pointer}
  .detail-body{padding:18px 14px}.detail-title{font-family:'Anton',sans-serif;font-size:24px;letter-spacing:.4px;margin:0 0 4px}.detail-meta{color:var(--grey);font-size:13px;margin-bottom:16px}
  .detail-score{background:var(--turf);border:1px solid var(--field-line);border-top:3px solid var(--gold);margin-bottom:14px}.detail-section{background:var(--turf);border:1px solid var(--field-line);margin-top:12px;padding:14px}.detail-section h2{font-family:'Anton',sans-serif;font-size:16px;letter-spacing:1px;margin:0 0 12px;text-transform:uppercase}.stat-row{display:grid;grid-template-columns:1fr 82px 1fr;align-items:center;border-top:1px solid var(--field-line);padding:9px 0;text-align:center;font-size:13px}.stat-row:first-of-type{border-top:0}.stat-row .label{color:var(--grey);font-size:11px;text-transform:uppercase}.detail-loading{text-align:center;padding:28px;color:var(--grey)}
  @media(min-width:780px){.screen{max-width:1040px;padding-left:12px;padding-right:12px}.games-grid{grid-template-columns:1fr 1fr;gap:0}.stat-grid{grid-template-columns:repeat(4,1fr)}.hero{display:grid;grid-template-columns:1fr 280px;align-items:end}.hero .select-wrap{grid-column:2;grid-row:1/4}.game-card{height:calc(100% - 14px)}}
  @media(max-width:370px){.updated{padding:4px 6px}.masthead .title{font-size:13px}.scoreboard{padding-left:10px;padding-right:10px}.team-block .tname{font-size:12px}.score-mid{font-size:29px}}
</style>
</head>
<body>
<div class="screen">

  <div class="marquee">
    <div class="masthead">
      <div class="badge"><span class="fmain">FF</span><span class="fsub">26</span></div>
      <div class="sub"><div class="title">FF26 NFL Season Lines</div></div>
      <div class="updated"><span class="dot"></span><span id="updated">SEASON TRACKER</span></div>
    </div>
    <div class="week-strip" id="weekbar" aria-label="Select week"></div>
  </div>

  <div class="hero">
    <div class="eyebrow" id="phase">Regular Season</div>
    <h1 id="weektitle">Week 1</h1>
    <div class="tagline">Every matchup. Every closing line. One season ledger.</div>
    <div class="select-wrap"><select id="weekselect" aria-label="Choose a week"></select></div>
  </div>

  <div class="stat-grid">
    <div class="stat-tile"><div class="num" id="gamesCount">—</div><div class="lbl">Games</div></div>
    <div class="stat-tile"><div class="num" id="finalCount">—</div><div class="lbl">Final</div></div>
    <div class="stat-tile"><div class="num" id="favCount">—</div><div class="lbl">Favorites SU</div></div>
    <div class="stat-tile"><div class="num" id="ouCount">—</div><div class="lbl">Over&#8211;Under</div></div>
  </div>
  <div class="list-view" id="listView">
    <div class="error" id="error"></div>
    <div id="schedule"></div>
    <footer class="footer"><span>FF26 · 2026 NFL Season</span><span>Closing lines lock after each final</span></footer>
  </div>
  <section class="detail-view" id="detailView" aria-live="polite"></section>
</div>
<script>
const TEAM={ARI:['Arizona Cardinals','#97233F','ari'],ATL:['Atlanta Falcons','#A71930','atl'],BAL:['Baltimore Ravens','#241773','bal'],BUF:['Buffalo Bills','#00338D','buf'],CAR:['Carolina Panthers','#0085CA','car'],CHI:['Chicago Bears','#0B162A','chi'],CIN:['Cincinnati Bengals','#FB4F14','cin'],CLE:['Cleveland Browns','#311D00','cle'],DAL:['Dallas Cowboys','#003594','dal'],DEN:['Denver Broncos','#FB4F14','den'],DET:['Detroit Lions','#0076B6','det'],GB:['Green Bay Packers','#203731','gb'],HOU:['Houston Texans','#03202F','hou'],IND:['Indianapolis Colts','#002C5F','ind'],JAX:['Jacksonville Jaguars','#006778','jax'],KC:['Kansas City Chiefs','#E31837','kc'],LV:['Las Vegas Raiders','#000000','lv'],LAC:['Los Angeles Chargers','#0080C6','lac'],LAR:['Los Angeles Rams','#003594','lar'],MIA:['Miami Dolphins','#008E97','mia'],MIN:['Minnesota Vikings','#4F2683','min'],NE:['New England Patriots','#002244','ne'],NO:['New Orleans Saints','#D3BC8D','no'],NYG:['New York Giants','#0B2265','nyg'],NYJ:['New York Jets','#125740','nyj'],PHI:['Philadelphia Eagles','#004C54','phi'],PIT:['Pittsburgh Steelers','#101820','pit'],SF:['San Francisco 49ers','#AA0000','sf'],SEA:['Seattle Seahawks','#002244','sea'],TB:['Tampa Bay Buccaneers','#D50A0A','tb'],TEN:['Tennessee Titans','#0C2340','ten'],WAS:['Washington Commanders','#5A1414','wsh']};
const WEEKS=[...Array.from({length:18},(_,i)=>({id:i+1,label:`W${i+1}`,title:`Week ${i+1}`,phase:'Regular Season'})),{id:'WC',label:'WC',title:'Wild Card',phase:'Playoffs'},{id:'DIV',label:'DIV',title:'Divisional',phase:'Playoffs'},{id:'CONF',label:'CONF',title:'Conference Championships',phase:'Playoffs'},{id:'SB',label:'SB',title:'Super Bowl LXI',phase:'Championship'}];
let data={},current=1;
const logo=t=>`https://a.espncdn.com/i/teamlogos/nfl/500/${TEAM[t][2]}.png`;
const signed=n=>n>0?`+${n}`:`${n}`;
function team(t,score){const a=TEAM[t]||[t,'#24352A',t.toLowerCase()];return `<div class="team-block"><div class="crest" style="background:${a[1]}"><img src="${logo(t)}" alt="${a[0]} logo" onerror="this.parentElement.textContent='${t}'"></div><div class="tname">${a[0]}</div><div class="tscore">${score==null?'—':`Score · ${score}`}</div></div>`}
function card(g){const fin=g.status==='final';const winner=fin?(g.homeScore>g.awayScore?g.home:g.away):null;return `<article class="game-card"><div class="game-top"><span>${g.time}</span><span class="${fin?'final':'scheduled'}">${fin?'FINAL':'SCHEDULED'}</span></div><div class="scoreboard">${team(g.away,g.awayScore)}<div class="score-mid">${fin?`${g.awayScore}<br>${g.homeScore}`:'AT'}</div>${team(g.home,g.homeScore)}</div><div class="lines-row"><div class="col"><div class="lbl">${fin?'Closing':'Current'} Spread</div><div class="val">${g.favorite||'—'} ${g.spread==null?'—':signed(g.spread)}</div></div><div class="col"><div class="lbl">${fin?'Closing':'Current'} Total</div><div class="val">O/U ${g.total??'—'}</div></div></div><div class="result-row">${fin?`<span>Winner · <b>${winner}</b></span><span class="win">ATS · ${g.ats||'—'}</span><span class="push">${(g.ou||'—').toUpperCase()}</span>`:'<span>Matchup line</span><span>Locks after kickoff</span>'}</div><button class="game-action" onclick="openGame('${g.id}')">${fin?'RECAP &amp; STATS':'MATCHUP'} &rarr;</button></article>`}
function render(){const meta=WEEKS.find(w=>String(w.id)===String(current)),games=data[current]||[];weektitle.textContent=meta.title;phase.textContent=meta.phase;gamesCount.textContent=games.length||'—';const finals=games.filter(g=>g.status==='final');finalCount.textContent=finals.length;const favWins=finals.filter(g=>(g.homeScore>g.awayScore?g.home:g.away)===g.favorite).length;favCount.textContent=finals.length?`${favWins}–${finals.length-favWins}`:'—';const over=finals.filter(g=>g.ou==='over').length,under=finals.filter(g=>g.ou==='under').length;ouCount.textContent=finals.length?`${over}–${under}`:'—';document.querySelectorAll('.week-chip').forEach(b=>b.classList.toggle('active',String(b.dataset.week)===String(current)));weekselect.value=current;if(!games.length){schedule.innerHTML=`<div class="empty"><b>${meta.title} is ready.</b><br><br>Matchups will appear when the season file is updated.</div>`;return}const groups=games.reduce((o,g)=>((o[g.day]??=[]).push(g),o),{});schedule.innerHTML=Object.entries(groups).map(([day,gs])=>`<section><div class="yard-marker">${day}</div><div class="games-grid">${gs.map(card).join('')}</div></section>`).join('')}
function choose(id){current=/^\d+$/.test(id)?Number(id):id;render();weektitle.scrollIntoView({behavior:'smooth',block:'start'})}
let returnScroll=0;
function findGame(id){return Object.values(data).flat().find(g=>g.id===id)}
function detailScore(g){const fin=g.status==='final';return `<div class="detail-score"><div class="game-top"><span>${g.day} · ${g.time}</span><span class="${fin?'final':'scheduled'}">${fin?'FINAL':'SCHEDULED'}</span></div><div class="scoreboard">${team(g.away,g.awayScore)}<div class="score-mid">${fin?`${g.awayScore}<br>${g.homeScore}`:'AT'}</div>${team(g.home,g.homeScore)}</div><div class="lines-row"><div class="col"><div class="lbl">${fin?'Closing':'Current'} Spread</div><div class="val">${g.favorite||'—'} ${g.spread==null?'—':signed(g.spread)}</div></div><div class="col"><div class="lbl">${fin?'Closing':'Current'} Total</div><div class="val">O/U ${g.total??'—'}</div></div></div></div>`}
function statRows(stats,g){if(!stats?.length)return '<div class="detail-loading">Detailed team stats will appear when ESPN posts them.</div>';const wanted=['firstDowns','totalYards','netPassingYards','rushingYards','turnovers','possessionTime'];const rows=wanted.map(k=>stats.find(s=>s.name===k)).filter(Boolean);return rows.map(s=>`<div class="stat-row"><b>${s.displayValue||s.value||'—'}</b><span class="label">${s.label||s.name}</span><b>${s.opponentValue||'—'}</b></div>`).join('')}
async function openGame(id){const g=findGame(id);if(!g)return;returnScroll=scrollY;listView.classList.add('hidden');detailView.classList.add('active');detailView.innerHTML=`<div class="detail-head"><button class="back-btn" onclick="closeGame()">&larr; BACK TO WEEK ${current}</button></div><div class="detail-body"><h1 class="detail-title">${g.status==='final'?'RECAP & STATS':'MATCHUP'}</h1><div class="detail-meta">${TEAM[g.away][0]} at ${TEAM[g.home][0]}</div>${detailScore(g)}<div class="detail-section"><h2>Team Stats</h2><div class="detail-loading">Loading game statistics…</div></div></div>`;scrollTo(0,0);history.pushState({game:id},'',`#game-${id}`);try{const date=g.kickoff.slice(0,10).replaceAll('-','');const board=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=${date}`).then(r=>r.json());const event=(board.events||[]).find(e=>{const c=e.competitions?.[0]?.competitors||[];return c.some(x=>x.team.abbreviation===g.away)&&c.some(x=>x.team.abbreviation===g.home)});if(!event)throw Error();const summary=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=${event.id}`).then(r=>r.json());const competitors=summary.boxscore?.teams||[];const awayStats=competitors.find(x=>x.team.abbreviation===g.away)?.statistics||[];const homeStats=competitors.find(x=>x.team.abbreviation===g.home)?.statistics||[];const merged=awayStats.map(a=>({...a,opponentValue:homeStats.find(h=>h.name===a.name)?.displayValue}));detailView.querySelector('.detail-section').innerHTML=`<h2>Team Stats</h2><div class="stat-row"><b>${g.away}</b><span class="label">STAT</span><b>${g.home}</b></div>${statRows(merged,g)}` }catch(e){detailView.querySelector('.detail-section').innerHTML='<h2>Team Stats</h2><div class="detail-loading">Detailed stats are not available yet.</div>'}}
function closeGame(fromPop=false){detailView.classList.remove('active');listView.classList.remove('hidden');if(!fromPop&&location.hash.startsWith('#game-'))history.back();requestAnimationFrame(()=>scrollTo(0,returnScroll))}
addEventListener('popstate',()=>{if(detailView.classList.contains('active'))closeGame(true)});
function init(){WEEKS.forEach(w=>{const b=document.createElement('button');b.className='week-chip';b.dataset.week=w.id;b.textContent=w.label;b.onclick=()=>choose(w.id);weekbar.appendChild(b);const o=document.createElement('option');o.value=w.id;o.textContent=`${w.phase} · ${w.title}`;weekselect.appendChild(o)});weekselect.onchange=e=>choose(e.target.value);render();loadJson()}
async function loadJson(){try{const r=await fetch('./ff26-nfl-lines-2026.json',{cache:'no-store'});if(!r.ok)throw Error('Season data unavailable');const j=await r.json();for(const w of j.weeks||[]){data[w.week]=(w.games||[]).map(g=>({id:g.game_id,kickoff:g.kickoff_et,day:new Date(g.kickoff_et).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'America/New_York'}),time:new Date(g.kickoff_et).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}),away:g.away,home:g.home,status:g.status,awayScore:g.away_score,homeScore:g.home_score,favorite:g.closing_favorite||g.market_favorite,spread:g.closing_spread??g.market_spread,total:g.closing_total??g.market_total,ats:g.ats_winner,ou:g.total_result}))}updated.textContent=`UPD ${new Date(j.updated_at).toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'})}`;render()}catch(e){error.style.display='block';error.textContent='Season data could not be loaded. Please refresh.'}}
init();
</script>
</body>
</html>
