<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>FF26 NFL Season Lines</title>
  <style>
    :root{--bg:#07101c;--panel:#0d1929;--panel2:#111f31;--line:#24364d;--text:#f7f9fc;--muted:#9eacc0;--gold:#f7c948;--green:#48d597;--red:#ff6b78;--radius:18px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#173055 0,#081321 36%,var(--bg) 70%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    button,select{font:inherit}.shell{width:min(1180px,100%);margin:auto;padding:0 16px 64px}.topbar{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(7,16,28,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08)}
    .brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px}.shield{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#ffd75e,#d99b12);color:#09111d;font-weight:950;letter-spacing:-1px;box-shadow:0 8px 22px #0008}.brand h1{font-size:1.08rem;margin:0;letter-spacing:.03em}.brand p{font-size:.75rem;margin:2px 0 0;color:var(--muted)}
    .live{display:flex;align-items:center;gap:7px;border:1px solid #2f435e;border-radius:999px;padding:7px 10px;font-size:.76rem;color:#cbd6e4}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #48d5971f}
    .weekbar{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding:13px 0 3px}.weekbar::-webkit-scrollbar{display:none}.weekbtn{flex:0 0 auto;border:1px solid #2b3c53;background:#0c1726;color:#aebbd0;border-radius:11px;padding:9px 13px;font-weight:750;font-size:.82rem;cursor:pointer}.weekbtn.active{background:var(--gold);border-color:var(--gold);color:#101722;box-shadow:0 4px 18px #f7c9482e}
    .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:26px 0 16px}.eyebrow{color:var(--gold);font-size:.75rem;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.hero h2{font-size:clamp(1.7rem,6vw,3rem);line-height:1;margin:7px 0 9px;letter-spacing:-.045em}.hero p{margin:0;color:var(--muted);font-size:.9rem}.weekselect{min-width:150px;background:#111f31;color:white;border:1px solid #31445e;border-radius:12px;padding:11px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:4px 0 22px}.stat{background:linear-gradient(155deg,#13233a,#0c1726);border:1px solid #22354c;border-radius:15px;padding:13px}.stat strong{display:block;font-size:1.28rem}.stat span{display:block;color:var(--muted);font-size:.72rem;margin-top:2px;text-transform:uppercase;letter-spacing:.08em}
    .day{margin:28px 0 11px;display:flex;align-items:center;gap:10px}.day h3{font-size:.88rem;text-transform:uppercase;letter-spacing:.13em;margin:0;white-space:nowrap}.day:after{content:"";height:1px;background:#23344a;flex:1}
    .games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--awayTint),var(--homeTint));border:1px solid rgba(255,255,255,.13);border-radius:var(--radius);box-shadow:0 14px 34px #0005}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,var(--awayColor) -40%,transparent 33%,transparent 67%,var(--homeColor) 140%);opacity:.27;pointer-events:none}.cardhead,.teams,.lineinfo,.resultbar{position:relative}.cardhead{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.09);font-size:.75rem;color:#c5d0df}.status{font-weight:850;text-transform:uppercase;letter-spacing:.08em}.status.final{color:var(--green)}.status.scheduled{color:var(--gold)}
    .teams{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;padding:18px 14px 14px}.team{display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center}.logo{width:74px;height:74px;object-fit:contain;filter:drop-shadow(0 8px 10px #0008)}.teamname{font-weight:900;font-size:.94rem;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.record{font-size:.72rem;color:#adbbce;margin-top:2px}.score{font-size:1.9rem;font-weight:950;line-height:1}.at{font-size:.76rem;color:#8391a6;text-transform:uppercase;font-weight:800}.divider{text-align:center}.lineinfo{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(255,255,255,.09)}.market{padding:11px 14px;text-align:center}.market+ .market{border-left:1px solid rgba(255,255,255,.09)}.market label{display:block;color:#93a2b7;font-size:.66rem;text-transform:uppercase;letter-spacing:.1em}.market strong{display:block;margin-top:3px;font-size:.94rem}.resultbar{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;background:#060d17a8;font-size:.75rem;color:#cdd7e5}.winner{color:var(--green);font-weight:800}
    .empty{grid-column:1/-1;text-align:center;padding:44px 22px;border:1px dashed #31435b;border-radius:18px;color:var(--muted);background:#0b1624}.footer{margin-top:34px;padding-top:18px;border-top:1px solid #21324a;color:#8291a6;font-size:.76rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.error{display:none;margin:12px 0;background:#351922;border:1px solid #71303d;color:#ffd7dc;padding:12px;border-radius:12px;font-size:.83rem}
    @media(max-width:760px){.shell{padding-left:12px;padding-right:12px}.topbar{margin:0 -12px;padding-left:12px;padding-right:12px}.games{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.weekselect{width:100%}.stats{grid-template-columns:repeat(2,1fr)}.brand p{display:none}.logo{width:66px;height:66px}.teams{padding-top:16px}}
    @media(max-width:370px){.live{display:none}.teamname{font-size:.84rem}.teams{grid-template-columns:1fr 42px 1fr}.logo{width:58px;height:58px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell" style="padding-bottom:0">
      <div class="brandrow">
        <div class="brand"><div class="shield">FF</div><div><h1>FF26 NFL SEASON LINES</h1><p>Scores · Closing spreads · Over/under</p></div></div>
        <div class="live"><span class="dot"></span><span id="updated">Season tracker</span></div>
      </div>
      <nav class="weekbar" id="weekbar" aria-label="Select week"></nav>
    </div>
  </header>
  <main class="shell">
    <section class="hero">
      <div><div class="eyebrow" id="phase">Regular Season</div><h2 id="weektitle">Week 1</h2><p id="weekdesc">Every matchup. Every closing line. One season ledger.</p></div>
      <select class="weekselect" id="weekselect" aria-label="Choose a week"></select>
    </section>
    <div class="error" id="error"></div>
    <section class="stats" aria-label="Week summary">
      <div class="stat"><strong id="gamesCount">16</strong><span>Games</span></div>
      <div class="stat"><strong id="finalCount">1</strong><span>Final</span></div>
      <div class="stat"><strong id="favCount">1–0</strong><span>Favorites SU</span></div>
      <div class="stat"><strong id="ouCount">0–1</strong><span>Over–Under</span></div>
    </section>
    <div id="schedule"></div>
    <footer class="footer"><span>FF26 · 2026 NFL Season</span><span>Closing lines lock after each final</span></footer>
  </main>
  <script>
    const TEAM={
      ARI:['Arizona Cardinals','#97233F','#FFB612','ari'],ATL:['Atlanta Falcons','#A71930','#000000','atl'],BAL:['Baltimore Ravens','#241773','#9E7C0C','bal'],BUF:['Buffalo Bills','#00338D','#C60C30','buf'],CAR:['Carolina Panthers','#0085CA','#101820','car'],CHI:['Chicago Bears','#0B162A','#C83803','chi'],CIN:['Cincinnati Bengals','#FB4F14','#000000','cin'],CLE:['Cleveland Browns','#311D00','#FF3C00','cle'],DAL:['Dallas Cowboys','#003594','#869397','dal'],DEN:['Denver Broncos','#FB4F14','#002244','den'],DET:['Detroit Lions','#0076B6','#B0B7BC','det'],GB:['Green Bay Packers','#203731','#FFB612','gb'],HOU:['Houston Texans','#03202F','#A71930','hou'],IND:['Indianapolis Colts','#002C5F','#A2AAAD','ind'],JAX:['Jacksonville Jaguars','#006778','#D7A22A','jax'],KC:['Kansas City Chiefs','#E31837','#FFB81C','kc'],LV:['Las Vegas Raiders','#000000','#A5ACAF','lv'],LAC:['Los Angeles Chargers','#0080C6','#FFC20E','lac'],LAR:['Los Angeles Rams','#003594','#FFA300','lar'],MIA:['Miami Dolphins','#008E97','#FC4C02','mia'],MIN:['Minnesota Vikings','#4F2683','#FFC62F','min'],NE:['New England Patriots','#002244','#C60C30','ne'],NO:['New Orleans Saints','#D3BC8D','#101820','no'],NYG:['New York Giants','#0B2265','#A71930','nyg'],NYJ:['New York Jets','#125740','#000000','nyj'],PHI:['Philadelphia Eagles','#004C54','#A5ACAF','phi'],PIT:['Pittsburgh Steelers','#101820','#FFB612','pit'],SF:['San Francisco 49ers','#AA0000','#B3995D','sf'],SEA:['Seattle Seahawks','#002244','#69BE28','sea'],TB:['Tampa Bay Buccaneers','#D50A0A','#34302B','tb'],TEN:['Tennessee Titans','#0C2340','#4B92DB','ten'],WAS:['Washington Commanders','#5A1414','#FFB612','wsh']
    };
    const WEEKS=[...Array.from({length:18},(_,i)=>({id:i+1,label:`W${i+1}`,title:`Week ${i+1}`,phase:'Regular Season'})),{id:'WC',label:'WC',title:'Wild Card',phase:'Playoffs'},{id:'DIV',label:'DIV',title:'Divisional',phase:'Playoffs'},{id:'CONF',label:'CONF',title:'Conference Championships',phase:'Playoffs'},{id:'SB',label:'SB',title:'Super Bowl LXI',phase:'Championship'}];
    const G=[
      ['Wed · Sep 9','NE','SEA','FINAL',10,13,'SEA',-3.5,44.5,'NE','UNDER','8:20 PM'],['Thu · Sep 10','SF','LAR','SCHEDULED',null,null,'LAR',-3.5,48.5,null,null,'8:35 PM'],
      ['Sun · Sep 13','ATL','PIT','SCHEDULED',null,null,'PIT',-3.5,42.5,null,null,'1:00 PM'],['Sun · Sep 13','BAL','IND','SCHEDULED',null,null,'BAL',-3.5,47.5,null,null,'1:00 PM'],['Sun · Sep 13','BUF','HOU','SCHEDULED',null,null,'BUF',-1.5,44.5,null,null,'1:00 PM'],['Sun · Sep 13','CHI','CAR','SCHEDULED',null,null,'CHI',-3.5,47.5,null,null,'1:00 PM'],['Sun · Sep 13','CLE','JAX','SCHEDULED',null,null,'JAX',-8.5,40.5,null,null,'1:00 PM'],['Sun · Sep 13','NO','DET','SCHEDULED',null,null,'DET',-6.5,49.5,null,null,'1:00 PM'],['Sun · Sep 13','NYJ','TEN','SCHEDULED',null,null,'TEN',-1.5,38.5,null,null,'1:00 PM'],['Sun · Sep 13','TB','CIN','SCHEDULED',null,null,'CIN',-3.5,50.5,null,null,'1:00 PM'],
      ['Sun · Sep 13','ARI','LAC','SCHEDULED',null,null,'LAC',-9.5,47.5,null,null,'4:25 PM'],['Sun · Sep 13','GB','MIN','SCHEDULED',null,null,'MIN',-1.5,46.5,null,null,'4:25 PM'],['Sun · Sep 13','MIA','LV','SCHEDULED',null,null,'LV',-3.5,40.5,null,null,'4:25 PM'],['Sun · Sep 13','WAS','PHI','SCHEDULED',null,null,'PHI',-4.5,44.5,null,null,'4:25 PM'],['Sun · Sep 13','DAL','NYG','SCHEDULED',null,null,'DAL',-2.5,48.5,null,null,'8:20 PM'],['Mon · Sep 14','DEN','KC','SCHEDULED',null,null,'KC',-2.5,43.5,null,null,'8:15 PM']
    ].map((x,i)=>({id:`2026-W01-${x[1]}-${x[2]}`,day:x[0],away:x[1],home:x[2],status:x[3].toLowerCase(),awayScore:x[4],homeScore:x[5],favorite:x[6],spread:x[7],total:x[8],ats:x[9],ou:x[10]?.toLowerCase(),time:x[11]}));
    let data={1:G},current=1;
    const logo=t=>`https://a.espncdn.com/i/teamlogos/nfl/500/${TEAM[t][3]}.png`;
    const tint=c=>`${c}24`; const signed=n=>n>0?`+${n}`:`${n}`;
    function team(t,score){const a=TEAM[t];return `<div class="team"><img class="logo" src="${logo(t)}" alt="${a[0]} logo" onerror="this.style.display='none'"><div class="teamname">${a[0]}</div><div class="record">${score==null?'0–0':`Score · ${score}`}</div></div>`}
    function card(g){const a=TEAM[g.away],h=TEAM[g.home],fin=g.status==='final';return `<article class="card" style="--awayColor:${a[1]};--homeColor:${h[1]};--awayTint:${tint(a[1])};--homeTint:${tint(h[1])}"><div class="cardhead"><span>${g.time}</span><span class="status ${g.status}">${fin?'Final':g.status}</span></div><div class="teams">${team(g.away,g.awayScore)}<div class="divider"><div class="${fin?'score':'at'}">${fin?`${g.awayScore}<br>${g.homeScore}`:'AT'}</div></div>${team(g.home,g.homeScore)}</div><div class="lineinfo"><div class="market"><label>${fin?'Closing spread':'Current spread'}</label><strong>${g.favorite} ${signed(g.spread)}</strong></div><div class="market"><label>${fin?'Closing total':'Current total'}</label><strong>O/U ${g.total}</strong></div></div><div class="resultbar">${fin?`<span>Winner · <b>${g.homeScore>g.awayScore?g.home:g.away}</b></span><span class="winner">ATS · ${g.ats}</span><span>${g.ou.toUpperCase()}</span>`:`<span>Matchup line</span><span>Locks after kickoff</span>`}</div></article>`}
    function render(){const meta=WEEKS.find(w=>String(w.id)===String(current)),games=data[current]||[];document.getElementById('weektitle').textContent=meta.title;document.getElementById('phase').textContent=meta.phase;document.getElementById('gamesCount').textContent=games.length||'—';const finals=games.filter(g=>g.status==='final');document.getElementById('finalCount').textContent=finals.length;const favWins=finals.filter(g=>(g.homeScore>g.awayScore?g.home:g.away)===g.favorite).length;document.getElementById('favCount').textContent=finals.length?`${favWins}–${finals.length-favWins}`:'—';const over=finals.filter(g=>g.ou==='over').length,under=finals.filter(g=>g.ou==='under').length;document.getElementById('ouCount').textContent=finals.length?`${over}–${under}`:'—';document.querySelectorAll('.weekbtn').forEach(b=>b.classList.toggle('active',String(b.dataset.week)===String(current)));document.getElementById('weekselect').value=current;const out=document.getElementById('schedule');if(!games.length){out.innerHTML=`<div class="empty"><strong>${meta.title} is ready.</strong><br><br>Matchups will appear here when the season file is updated.</div>`;return}const groups=Object.groupBy?Object.groupBy(games,g=>g.day):games.reduce((o,g)=>((o[g.day]??=[]).push(g),o),{});out.innerHTML=Object.entries(groups).map(([day,gs])=>`<section><div class="day"><h3>${day}</h3></div><div class="games">${gs.map(card).join('')}</div></section>`).join('')}
    function init(){const bar=document.getElementById('weekbar'),sel=document.getElementById('weekselect');WEEKS.forEach(w=>{const b=document.createElement('button');b.className='weekbtn';b.dataset.week=w.id;b.textContent=w.label;b.onclick=()=>choose(w.id);bar.appendChild(b);const o=document.createElement('option');o.value=w.id;o.textContent=`${w.phase} · ${w.title}`;sel.appendChild(o)});sel.onchange=e=>choose(e.target.value);render();loadJson()}
    function choose(id){current=/^\d+$/.test(id)?Number(id):id;render();document.getElementById('weektitle').scrollIntoView({behavior:'smooth',block:'start'})}
    async function loadJson(){try{const r=await fetch('./ff26-nfl-lines-2026.json',{cache:'no-store'});if(!r.ok)return;const j=await r.json();for(const w of j.weeks||[]){data[w.week]=(w.games||[]).map(g=>({id:g.game_id,day:new Date(g.kickoff_et).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),time:new Date(g.kickoff_et).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}),away:g.away,home:g.home,status:g.status,awayScore:g.away_score,homeScore:g.home_score,favorite:g.closing_favorite||g.market_favorite,spread:g.closing_spread??g.market_spread,total:g.closing_total??g.market_total,ats:g.ats_winner,ou:g.total_result}))}document.getElementById('updated').textContent=`Updated ${new Date(j.updated_at).toLocaleDateString()}`;render()}catch(e){/* Embedded Week 1 keeps the single file useful. */}}
    init();
  </script>
</body>
</html>
